name: Patch NON ASSEGNATI filename

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-non-assigned-filename.cjs'
      - '.github/workflows/patch-non-assigned-filename.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/patch-non-assigned-filename.cjs
      - name: Commit patched OutlookEmail.tsx
        run: |
          if git diff --quiet; then
            echo 'Nessuna modifica da applicare'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/OutlookEmail.tsx
          git commit -m 'Preserve original filename for NON ASSEGNATI'
          git push
