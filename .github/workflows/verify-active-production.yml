name: Verify Active Production Calendar
on:
  push:
    branches:
      - "feature/attivo-produzione-mobile-calendario-libero"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile updated webapp
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Check custom-calendar date parsing and responsive view
        run: |
          ./node_modules/.bin/esbuild src/recessPeriod.ts --format=esm --platform=node --outfile=/tmp/recess-date.mjs
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import { recessReferenceDate, recessReferenceMonth } from "/tmp/recess-date.mjs";
          const raw = {NOTA_RECESSO: "NOTIFICA SW OUT_31/10/2026", DATA_VALIDITA_RECESSO: "01/11/2026"};
          assert.equal(recessReferenceDate(raw), "2026-10-31");
          assert.equal(recessReferenceMonth(raw), "2026-10");
          assert.equal(recessReferenceDate({NOTA_RECESSO:"NOTIFICA SW OUT_31/09/2026"}),"2026-09-30");
          assert.equal(recessReferenceDate({NOTA_RECESSO:"NOTIFICA SW OUT_01/01/2025"}),"2025-01-01");
          assert.equal(recessReferenceDate({NOTA_RECESSO:"senza data"}),"");
          const component=fs.readFileSync("src/ActiveProduction.tsx","utf8");
          const css=fs.readFileSync("src/activeProduction.css","utf8");
          for(const required of [
            'PERIODO LIBERO', 'type="date"', 'period.end >= customStart',
            'period.end <= customEnd', 'noteDate < customStart',
            'noteDate > customEnd', 'ap-mobile-agent-list',
          ]) assert(component.includes(required), required);
          assert(css.includes("@media (max-width: 760px)"));
          assert(css.includes(".ap-desktop-table { display: none"));
          console.log("Calendar dates and mobile layout checks passed.");
          JS
