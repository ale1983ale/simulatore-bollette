name: Verify Customer Balanced Pricing
on:
  push:
    branches:
      - "fix/bilanciato-disponibilita-per-tipo-cliente"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile webapp
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify domestic/business balanced selector logic
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import ts from "typescript";
          import assert from "node:assert/strict";
          const src = fs.readFileSync("src/App.tsx","utf8");
          const a=src.indexOf("const hasAvailableBalancedEnergyForType = (");
          const b=src.indexOf("const gasOfferPriceMode",a);
          assert(a>0 && b>a, "Availability helper not found");
          const snippet=src.slice(a,b);
          const transpiled=ts.transpileModule(snippet,{
            compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.None}
          }).outputText;
          const check=new Function("offers","visibility","tipo",`
            const BALANCED_DOMESTIC_NAME="+ BILANCIATA DOMESTICA";
            const BALANCED_BUSINESS_NAME="+ BILANCIATA BUSINESS";
            const energyTypeToGroup = type =>
              ["RESIDENTE","NON RESIDENTE","RESIDENTE CANONE ESENTE"].includes(type)
                ? "DOMESTICI": /^BTA/.test(type)?"BTA":/^MTA/.test(type)?"MT":null;
            const normalizeBalancedOffer = name=>name;
            const energyOfferAllowsType = (offer,type) =>
              (offer.allowedCustomerGroups || []).includes(energyTypeToGroup(type));
            ${transpiled}
            return hasAvailableBalancedEnergyForType(offers,visibility,tipo);
          `);
          const domestic={nome:"+ BILANCIATA DOMESTICA",visibile:false,allowedCustomerGroups:["DOMESTICI"]};
          const business={nome:"+ BILANCIATA BUSINESS",visibile:true,allowedCustomerGroups:["BTA","MT"]};
          const dedicated={nome:"+ BILANCIATA DEDICATA",visibile:true,allowedCustomerGroups:["DOMESTICI","BTA","MT"]};
          const visibility={energyBalanced:true};
          assert.equal(check([domestic,business,dedicated],visibility,"RESIDENTE"),false);
          assert.equal(check([domestic,business,dedicated],visibility,"NON RESIDENTE"),false);
          assert.equal(check([domestic,business,dedicated],visibility,"BTA2"),true);
          assert.equal(check([{...domestic,visibile:true},business,dedicated],visibility,"RESIDENTE"),true);
          assert.equal(check([{...domestic,visibile:true},business,dedicated],{energyBalanced:false},"RESIDENTE"),false);
          assert.equal(check([{...domestic,visibile:true},{...business,visibile:false},dedicated],visibility,"MTA3"),false);
          assert(src.includes("customerAllowedEnergyModes\n            )"),"selector not updated");
          assert(src.includes("tipologiaOfferta: nextMode"),"type switch not repaired");
          console.log("Verified domestic, business, dedicated and hidden balanced visibility.");
          JS
