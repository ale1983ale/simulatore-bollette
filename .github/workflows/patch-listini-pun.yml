name: Patch Listini and PUN defaults

on:
  push:
    branches:
      - main
    paths:
      - "scripts/patch-listini-pun.mjs"
      - ".github/workflows/patch-listini-pun.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply patch
        run: node scripts/patch-listini-pun.mjs

      - name: Commit patched App.tsx
        shell: bash
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Add manual Listini save and latest PUN year"
          git push
