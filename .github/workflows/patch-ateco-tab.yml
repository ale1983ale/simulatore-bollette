name: Patch ATECO tab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ateco-tab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch App.tsx
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          old_button = '  <button\n    onClick={() => setTab("punpsvPublic")}\n    style={{\n      ...baseBtn,\n      ...(tab === "punpsvPublic" ? activeBtn : {}),\n    }}\n  >\n    PUN / PSV\n  </button>\n'
          new_button = old_button + '\n  <button\n    onClick={() => setTab("ateco")}\n    style={{\n      ...baseBtn,\n      ...(tab === "ateco" ? activeBtn : {}),\n    }}\n  >\n    ATECO\n  </button>\n'
          if old_button not in text:
              raise SystemExit('Pulsante PUN/PSV non trovato')
          text = text.replace(old_button, new_button, 1)
          old_render = ') : tab === "report" ? (\n  <ReportAgent agentSession={agentSession} />\n        ) : tab === "punpsvPublic" ? (\n'
          new_render = ') : tab === "report" ? (\n  <ReportAgent agentSession={agentSession} />\n        ) : tab === "ateco" ? (\n          <div\n            style={{\n              background: "white",\n              padding: 24,\n              borderRadius: 16,\n              border: "1px solid #e2e8f0",\n              boxShadow: "0 1px 2px rgba(15, 23, 42, 0.04)",\n            }}\n          >\n            <h2 style={{ marginTop: 0, marginBottom: 12 }}>ATECO</h2>\n            <div style={{ color: "#64748b" }}>\n              Sezione ATECO pronta per le prossime funzioni.\n            </div>\n          </div>\n        ) : tab === "punpsvPublic" ? (\n'
          if old_render not in text:
              raise SystemExit('Blocco render Report/PUN non trovato')
          text = text.replace(old_render, new_render, 1)
          path.write_text(text)
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Add ATECO tab next to PUN PSV"
          git push origin main
