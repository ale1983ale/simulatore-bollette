name: Patch ATECO tab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ateco-tab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch App.tsx
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          old_button = '''  <button
    onClick={() => setTab("punpsvPublic")}
    style={{
      ...baseBtn,
      ...(tab === "punpsvPublic" ? activeBtn : {}),
    }}
  >
    PUN / PSV
  </button>
'''

          new_button = old_button + '''
  <button
    onClick={() => setTab("ateco")}
    style={{
      ...baseBtn,
      ...(tab === "ateco" ? activeBtn : {}),
    }}
  >
    ATECO
  </button>
'''

          if old_button not in text:
              raise SystemExit('Pulsante PUN/PSV non trovato')
          text = text.replace(old_button, new_button, 1)

          old_render = ''') : tab === "report" ? (
  <ReportAgent agentSession={agentSession} />
        ) : tab === "punpsvPublic" ? (
'''

          new_render = ''') : tab === "report" ? (
  <ReportAgent agentSession={agentSession} />
        ) : tab === "ateco" ? (
          <div
            style={{
              background: "white",
              padding: 24,
              borderRadius: 16,
              border: "1px solid #e2e8f0",
              boxShadow: "0 1px 2px rgba(15, 23, 42, 0.04)",
            }}
          >
            <h2 style={{ marginTop: 0, marginBottom: 12 }}>ATECO</h2>
            <div style={{ color: "#64748b" }}>
              Sezione ATECO pronta per le prossime funzioni.
            </div>
          </div>
        ) : tab === "punpsvPublic" ? (
'''

          if old_render not in text:
              raise SystemExit('Blocco render Report/PUN non trovato')
          text = text.replace(old_render, new_render, 1)

          path.write_text(text)
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Add ATECO tab next to PUN PSV"
          git push origin main
