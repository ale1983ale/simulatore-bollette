name: Diagnose production deployment
on:
  push:
    paths:
      - ".github/workflows/diagnose-production.yml"
  workflow_dispatch:
  # Manual diagnostics only; do not expose tokens in logs.
jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build current website
        run: |
          npm install --no-audit --no-fund
          npm run build
          echo "CURRENT_VERSION_HAS_ANDROID_BUTTON:"
          grep -l "data-android-package-download" dist/assets/*.js >/dev/null && echo "YES" || echo "NO"
      - name: Inspect deployed version and downloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, re, sys, time
          base="https://simulatore-bollette.vercel.app"
          req=urllib.request.Request(base+"/?diagnose="+str(int(time.time())),headers={"Cache-Control":"no-cache","User-Agent":"GestioneEnergiaDiagnostic"})
          try:
              with urllib.request.urlopen(req, timeout=25) as r:
                  html=r.read().decode("utf-8","replace")
                  print("SITE_HTTP:",r.status,"URL:",r.url)
                  print("DEPLOYMENT_HEADERS: ",{k:v for k,v in r.headers.items() if k.lower() in ("x-vercel-id","x-vercel-cache","server","cache-control")})
          except Exception as exc:
              print("SITE_ERROR:",repr(exc)); sys.exit(1)
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',html)
          print("SCRIPTS:",scripts)
          if not scripts: print("ERROR: No scripts in homepage"); sys.exit(2)
          for path in scripts:
              url=path if path.startswith("http") else base+path
              try:
                  with urllib.request.urlopen(url,timeout=25) as r:
                      js=r.read().decode("utf-8","replace")
                      print("JS_HTTP:",r.status,"PATH:",path,"LENGTH:",len(js))
                      for name,text in [("ANDROID_DOWNLOAD_MARKER","data-android-package-download"),("ZIP_MODULE","downloadZipBlob"),("ANDROID_ERROR_MESSAGE","questa versione"),("INSTALL_BUTTON","Installa app Android"),("NEW_APP_VERSION","1.0.7")]:
                          print(name,":",text in js)
              except Exception as exc: print("JS_ERROR:",path,repr(exc))
          for p in ("/Outlook-Invio-Android.apk",):
              req=urllib.request.Request(base+p,method="HEAD")
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      print("APK_HEAD:",p,r.status,r.headers.get("Content-Type"),r.headers.get("Content-Length"))
              except Exception as exc: print("APK_HEAD_ERROR:",repr(exc))
          PY
      - name: Check deployment configuration (existence only)
        shell: bash
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAS_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID != '' }}
          HAS_VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK != '' }}
          HAS_DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK != '' }}
        run: |
          echo "VERCEL_TOKEN_CONFIGURED: $HAS_VERCEL_TOKEN"
          echo "VERCEL_ORG_ID_CONFIGURED: $HAS_VERCEL_ORG_ID"
          echo "VERCEL_PROJECT_ID_CONFIGURED: $HAS_VERCEL_PROJECT_ID"
          echo "VERCEL_DEPLOY_HOOK_CONFIGURED: $HAS_VERCEL_DEPLOY_HOOK"
          echo "DEPLOY_HOOK_CONFIGURED: $HAS_DEPLOY_HOOK"
          if test -f .vercel/project.json; then echo "VERCEL_PROJECT_FILE: present"; else echo "VERCEL_PROJECT_FILE: absent"; fi
