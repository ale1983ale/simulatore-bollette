name: Patch NON ASSEGNATI routing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply patch
        run: node scripts/patch-non-assegnati.mjs

      - name: Validate build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit patched files and remove one-time patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/OutlookEmail.tsx src/OutlookEmailSingleDraftFix.tsx src/OutlookEmailAutoSendPackageSafe.tsx src/OutlookEmailPreview.tsx
          git rm scripts/patch-non-assegnati.mjs .github/workflows/patch-non-assegnati.yml
          git commit -m "Route unmatched rows to NON ASSEGNATI"
          git push
