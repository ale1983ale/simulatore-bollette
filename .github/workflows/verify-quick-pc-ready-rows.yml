name: Verify Quick PC Email Preparation
on:
  push:
    branches: [fix/invio-rapido-pc-righe-pronte]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Build app
        run: npm run build
      - name: Check ready recipient bridge
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const ui=fs.readFileSync('src/OutlookEmail.tsx','utf8');
          const quick=fs.readFileSync('src/OutlookEmailAutoSendPackageSafe.tsx','utf8');
          for (const part of [
            'window.addEventListener("outlook-email-quick-pc-request"',
            'const rows = readyRows', 'file: row.file',
            'nonAssignedFile', 'filesWithMissingEmail', 'isValidEmail(row.email)'
          ]) assert(ui.includes(part), 'React recipients missing '+part);
          for (const part of [
            'getQuickPcSnapshot(commonMode)',
            'const recipients = snapshot.rows', 'zip.file(rel, row.file)',
            'INVIA_EMAIL_OUTLOOK.vbs'
          ]) assert(quick.includes(part), 'Quick PC missing '+part);
          assert(!quick.includes('window.alert("Non trovo email pronte da preparare.")'));
          console.log('Quick PC uses current verified recipients with real matched attachments.');
          JS
