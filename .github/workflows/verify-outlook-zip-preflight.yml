name: Verify Outlook ZIP Attachment Preflight
on:
  push:
    branches: [fix/outlook-zip-extraction-preflight]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Ensure extraction error handled before Outlook starts
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const src = fs.readFileSync("src/OutlookEmailAutoSendPackageSafe.tsx", "utf8");
          const f = src.slice(src.indexOf("function buildVbsScript("),src.indexOf("export default function OutlookEmailAutoSendPackageSafe()"));
          assert(f.includes('const attachmentList = item.attachments.map'), "Windows attachment path missing");
          assert(f.includes('InStr(1, root, ".zip.", vbTextCompare) > 0'), "Missing ZIP temp folder guard");
          assert(f.includes('If Not fso.FolderExists(fso.BuildPath(root, "allegati"))'), "Missing extracted attachment folder guard");
          assert(f.includes('If Not fso.FileExists(fullPath)'), "Missing attachment preflight");
          assert(f.indexOf('For i = 0 To maxItems - 1') < f.indexOf('Set outlook = CreateObject("Outlook.Application")'), "Outlook opens before preflight");
          assert(f.includes("Nessuna email e stata inviata."), "Missing failed-test wording");
          assert(src.includes("NON aprire INVIA_EMAIL_OUTLOOK.vbs direttamente dentro lo ZIP"));
          console.log("Outlook package checks extraction and every attachment before starting Outlook.");
          JS
