name: Verify Attivo Produzione Report Flags
on:
  push:
    branches:
      - "fix/attivo-produzione-escludi-agenti-report"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build webapp
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify flag applied to all Attivo Produzione records
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const src=fs.readFileSync("src/ActiveProduction.tsx","utf8");
          for (const required of [
            '"production_agent_zones"', '"agent_key,include_in_report"',
            'item.include_in_report === false',
            'excludedAgentKeys.has(keyForAgent(row.agent_key || row.agente))',
            'excludedAgentKeys.has(keyForAgent(row.agente))',
            'recesses, excludedAgentKeys',
            'const agentOptions = useMemo(() => agentSummaries',
            'for (const agent of displayed)',
            'const dataRows = displayed.flatMap'
          ]) assert(src.includes(required), "Missing: "+required);
          console.log("Excluded agents removed before agent list, totals and PDF data.");
          JS
