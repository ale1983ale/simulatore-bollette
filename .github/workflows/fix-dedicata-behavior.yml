name: Fix DEDICATA behavior

on:
  push:
    branches:
      - fix/restore-dedicata-behavior
    paths:
      - "scripts/fix-dedicata-behavior.mjs"
      - ".github/workflows/fix-dedicata-behavior.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/restore-dedicata-behavior
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply patch
        run: node scripts/fix-dedicata-behavior.mjs

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Commit patched App.tsx
        shell: bash
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Restore DEDICATA and fixed dedicated fields"
          git push
