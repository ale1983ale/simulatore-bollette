name: Patch NON ASSEGNATI filename

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-non-assegnati-filename.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch OutlookEmail.tsx
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/OutlookEmail.tsx')
          text = path.read_text()

          old_signature = '''async function buildNonAssignedWorkbook(
            sources: SourceAgency[],
            generatedByAgency: Map<string, File>,
            preferredHeader: string
          ): Promise<File | null> {'''
          new_signature = '''async function buildNonAssignedWorkbook(
            sources: SourceAgency[],
            generatedByAgency: Map<string, File>,
            preferredHeader: string,
            originalFileName: string
          ): Promise<File | null> {'''
          if old_signature not in text:
              raise SystemExit('Firma buildNonAssignedWorkbook non trovata')
          text = text.replace(old_signature, new_signature, 1)

          old_return = '''  const outData = XLSX.write(outWorkbook, { type: "array", bookType: "xlsx" }) as ArrayBuffer;
            return new File([outData], NON_ASSIGNED_LABEL + ".xlsx", {
              type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
            });'''
          new_return = '''  const originalStem = sanitizeFileName(stripExtension(originalFileName || "")).trim();
            const nonAssignedFileName = `${NON_ASSIGNED_LABEL}${originalStem ? ` ${originalStem}` : ""}.xlsx`;
            const outData = XLSX.write(outWorkbook, { type: "array", bookType: "xlsx" }) as ArrayBuffer;
            return new File([outData], nonAssignedFileName, {
              type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
            });'''
          if old_return not in text:
              raise SystemExit('Blocco nome file NON ASSEGNATI non trovato')
          text = text.replace(old_return, new_return, 1)

          old_call = '''    void buildNonAssignedWorkbook(
                unassociatedSourceAgencies,
                generatedByAgency,
                preferredAgencyHeader
              )'''
          new_call = '''    void buildNonAssignedWorkbook(
                unassociatedSourceAgencies,
                generatedByAgency,
                preferredAgencyHeader,
                sourceFile?.name || files[0]?.name || ""
              )'''
          if old_call not in text:
              raise SystemExit('Chiamata buildNonAssignedWorkbook non trovata')
          text = text.replace(old_call, new_call, 1)

          old_deps = '  }, [fileMode, unassociatedSourceAgencies, generatedByAgency, preferredAgencyHeader]);'
          new_deps = '  }, [fileMode, unassociatedSourceAgencies, generatedByAgency, preferredAgencyHeader, sourceFile, files]);'
          if old_deps not in text:
              raise SystemExit('Dipendenze useEffect NON ASSEGNATI non trovate')
          text = text.replace(old_deps, new_deps, 1)

          path.write_text(text)
          PY

      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/OutlookEmail.tsx
          git commit -m "Preserve original name in NON ASSEGNATI file"
          git push origin main
