name: Build Android helper

on:
  push:
    branches: [main]
    paths:
      - 'android-helper/**'
      - '.github/workflows/build-android-helper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p android-helper assembleDebug
      - name: Publish APK into webapp public folder
        run: |
          mkdir -p public
          cp android-helper/app/build/outputs/apk/debug/app-debug.apk public/Outlook-Invio-Android.apk
      - name: Commit APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/Outlook-Invio-Android.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged'
          else
            git commit -m 'Build Android email helper APK'
            git push
          fi
