name: Patch NON ASSEGNATI filename

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-nonassigned-original-name.mjs"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/patch-nonassigned-original-name.mjs
      - name: Validate build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit patched OutlookEmail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/OutlookEmail.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Preserve original name in NON ASSEGNATI file"
            git push
          fi
