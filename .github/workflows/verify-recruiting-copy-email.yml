name: Verify Recruiting Copy Email
on:
  push:
    branches: [feature/recruiting-copy-email-button]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Check copy email buttons
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const code=fs.readFileSync('src/Recruiting.tsx','utf8');
          assert(code.includes('function CopyEmailButton({ email }'));
          assert(code.includes('await copyPlainText(email.trim())'));
          assert(code.includes('event.stopPropagation()'));
          assert(code.includes('<CopyEmailButton email={candidate.email} />'));
          assert(code.includes('<CopyEmailButton email={selectedCandidate.email} />'));
          assert(code.includes('Copia indirizzo email'));
          console.log('Copy email works on shared contacts/external list and details.');
          JS
