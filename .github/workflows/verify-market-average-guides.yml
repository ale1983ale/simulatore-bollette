name: Verify PUN PSV 12 Month Averages
on:
  push:
    branches: [feature/pun-psv-media-mobile-12mesi]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Test month-by-month means and chart integration
        run: |
          ./node_modules/.bin/esbuild src/marketAverages.ts --format=esm --platform=node --outfile=/tmp/marketAverages-test.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { last12MarketAverage, marketAverageChartY } from '/tmp/marketAverages-test.mjs';
          const months = ['OTTOBRE 2025','NOVEMBRE 2025','DICEMBRE 2025','GENNAIO 2026',
            'FEBBRAIO 2026','MARZO 2026','APRILE 2026','MAGGIO 2026','GIUGNO 2026',
            'LUGLIO 2026','AGOSTO 2026','SETTEMBRE 2026'];
          const pun=[.111,.117,.115,.132,.114,.143,.119,.119,.132,.157,.179,.208];
          const psv=[.324,.3491,.328,.4042,.3772,.558338,.493117,.501752,.504871,.6066,.6864,.843182];
          const rows=months.map((mese,i)=>({mese,mono:pun[i],psv:psv[i]}));
          assert.equal(last12MarketAverage(rows,'mono').toFixed(3),'0.137');
          assert.equal(last12MarketAverage(rows,'psv').toFixed(6),'0.498063');
          assert.equal(last12MarketAverage(rows.slice(1),'mono'),null);
          assert.equal(last12MarketAverage(rows.map((r,i)=>i===4?{...r,mono:0}:r),'mono'),null);
          assert.equal(last12MarketAverage(rows.map((r,i)=>i===4?{...r,mese:'GENNAIO 2027'}:r),'psv'),null);
          const y=marketAverageChartY(pun,last12MarketAverage(rows,'mono'));
          assert(y>30 && y<174);
          const src=fs.readFileSync('src/App.tsx','utf8');
          for(const name of ['PUN medio ultimi 12 mesi','PSV medio ultimi 12 mesi',
            'last12MarketAverage(chartPunPsvRows, "mono")',
            'last12MarketAverage(chartPunPsvRows, "psv")',
            'getLast12PunPsvRows(validPunPsvRowsChronological, effectivePunPsvMonth)',
            'strokeDasharray="9 6"']) assert(src.includes(name),name);
          assert(src.split('label="PUN medio ultimi 12 mesi"').length>=4);
          assert(src.split('label="PSV medio ultimi 12 mesi"').length>=4);
          console.log('PUN 0.137, PSV 0.498063: correct 12-month averages and UI locations.');
          JS
