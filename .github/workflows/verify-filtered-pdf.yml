name: Verify A4 Filtered PDF Reports
on:
  push:
    branches:
      - "feature/pdf-filtri-produzione-recessi-storico"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build updated website
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Generate and validate multipage A4 PDF
        run: |
          ./node_modules/.bin/esbuild src/filteredReportsPdf.ts --bundle --platform=node --format=esm --outfile=/tmp/filtered-pdf-test.mjs
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { exportFilteredA4Pdf } from "/tmp/filtered-pdf-test.mjs";
          let saved = null;
          globalThis.window = {
            AndroidFiles: {
              savePdf: (base64, fileName) => {
                saved = { data: Buffer.from(base64, "base64"), fileName };
              }
            }
          };
          const rows = Array.from({length: 175}, (_, n) => [
            "OTTOBRE 2026", n % 2 ? "LUCE" : "GAS",
            "CLIENTE DI PROVA CON DENOMINAZIONE ABBASTANZA LUNGA " + n,
            "IT001E00999999", "NOME COGNOME AGENTE", "NOTIFICA SW OUT_31/10/2026",
            String(n + 1), "1000,25"
          ]);
          await exportFilteredA4Pdf({
            title: "RECESSI - REPORT DI TEST",
            subtitle: "Prova della paginazione e layout.",
            filename: "Test_A4.pdf",
            columns: [
              {label:"MESE",width:28},{label:"TIPO",width:16},{label:"CLIENTE",width:49},
              {label:"POD/PDR",width:36},{label:"AGENTE",width:43},
              {label:"NOTA RECESSO",width:49},{label:"Q.TA",width:20,align:"right"},
              {label:"CONSUMO",width:32,align:"right"}
            ],
            rows, filters: ["Periodo: OTTOBRE 2026", "Agente: TUTTI", "Commodity: LUCE, GAS"],
            stats: [{label:"LUCE",value:"100"},{"label":"GAS",value:"75"}],
            note: "Test report multipagina."
          });
          assert(saved, "Il PDF non è stato consegnato al bridge Android");
          assert.equal(saved.fileName, "Test_A4.pdf");
          assert(saved.data.subarray(0,5).toString() === "%PDF-", "Non è un PDF");
          const text = saved.data.toString("latin1");
          assert(text.includes("/MediaBox [0 0 841.89 595.28]") ||
            text.includes("/MediaBox [0 0 841.8899999999999 595.28]") ||
            text.includes("/MediaBox"), "La dimensione pagina non è leggibile");
          const count = [...text.matchAll(/\/Type \/Page\b/g)].length;
          assert(count > 1, "PDF multipagina non creato");
          console.log("PDF output:", saved.fileName, saved.data.length, "bytes,", count, "pages.");
          JS
