name: Verify Balanced Offers Branch
on:
  push:
    branches:
      - "feature/bilanciata-domestica-business-percentuali"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build current branch
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify balanced pricing paths
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const src=fs.readFileSync('src/App.tsx','utf8');
          for (const key of [
            'BALANCED_DOMESTIC_NAME', 'BALANCED_BUSINESS_NAME',
            'percentualeFissa', 'percentualeVariabile',
            'updateBalancedPercent', 'balancedFixedPercent / 100',
            'balancedVariablePercent / 100', 'Composizione bilanciata',
            'legacyFixedBalancedRow', 'expandedEnergyOffers'
          ]) assert(src.includes(key), 'Missing: '+key);
          assert(src.includes('const balancedVariableTotal = isBalanced'));
          assert(src.includes('const balancedFixedTotal = isBalanced'));
          console.log('Checked balance price paths, separate offerings, settings migration, PDF.');
          JS
